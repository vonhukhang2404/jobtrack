<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>面接一覧 | JobTrack</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav th:replace="~{fragments/header :: navbar}"></nav>
<div class="container">
    <h1 class="h3 mb-3">面接一覧</h1>
    <a th:href="@{/interviews/new}" class="btn btn-primary mb-3">＋ 面接を追加</a>
    <a th:href="@{/calendar.ics}" class="btn btn-outline-secondary mb-3 ms-2">📅 カレンダーに出力（.ics）</a>

    <p th:if="${interviews.isEmpty()}">まだ面接が登録されていません。</p>

    <table class="table table-hover bg-white align-middle" th:unless="${interviews.isEmpty()}">
        <thead>
        <tr>
            <th>日時</th>
            <th>企業名</th>
            <th>職種</th>
            <th>回</th>
            <th>形式</th>
            <th>結果</th>
            <th>メモ</th>
            <th>操作</th>
        </tr>
        </thead>
        <tbody>
        <!-- これからの面接は青で強調 -->
        <tr th:each="i : ${interviews}"
            th:with="upcoming=${i.scheduledAt.isAfter(now)}"
            th:classappend="${upcoming} ? 'table-primary' : ''">
            <td class="text-nowrap">
                <span th:text="${#temporals.format(i.scheduledAt, 'yyyy/MM/dd HH:mm')}">2026/10/20 10:00</span>
                <span class="badge bg-primary ms-1" th:if="${upcoming}">予定</span>
            </td>
            <td th:text="${i.application.company.name}">企業名</td>
            <td th:text="${i.application.position}">職種</td>
            <td class="text-nowrap" th:text="'第' + ${i.round} + '次'">第1次</td>
            <td th:text="${i.format.label}">オンライン</td>
            <td>
                <span class="badge"
                      th:classappend="${i.result.name() == 'PASSED'} ? 'bg-success' : (${i.result.name() == 'FAILED'} ? 'bg-secondary' : 'bg-warning text-dark')"
                      th:text="${i.result.label}">結果待ち</span>
            </td>
            <td th:text="${i.notes}" style="white-space: pre-wrap;">メモ</td>
            <td class="text-nowrap">
                <a th:href="@{/interviews/{id}/edit(id=${i.id})}" class="btn btn-sm btn-outline-secondary">編集</a>
                <form th:action="@{/interviews/{id}/delete(id=${i.id})}" method="post" class="d-inline"
                      onsubmit="return confirm('この面接を削除しますか？');">
                    <button type="submit" class="btn btn-sm btn-outline-danger">削除</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
