<!DOCTYPE html>
<html lang="ja" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="#{interview.list} + ' | JobTrack'">面接一覧 | JobTrack</title>
    <th:block th:replace="~{fragments/header :: assets}"></th:block>
</head>
<body>
<header th:replace="~{fragments/header :: navbar}"></header>
<main class="container pb-5">
    <div class="jt-page-head">
        <h1 th:text="#{interview.list}">面接一覧</h1>
        <div class="d-flex flex-wrap gap-2">
            <a th:href="@{/calendar.ics}" class="btn btn-outline-secondary" th:text="#{common.exportIcs}">カレンダーに出力（.ics）</a>
            <a th:href="@{/interviews/new}" class="btn btn-primary" th:text="#{interview.add}">＋ 面接を追加</a>
        </div>
    </div>

    <p class="text-muted" th:if="${interviews.isEmpty()}" th:text="#{interview.empty}">まだ面接が登録されていません。</p>

    <div class="table-wrap" th:unless="${interviews.isEmpty()}">
        <table class="table table-hover align-middle">
            <thead>
            <tr>
                <th th:text="#{field.datetime}">日時</th>
                <th th:text="#{field.companyName}">企業名</th>
                <th th:text="#{field.position}">職種</th>
                <th th:text="#{field.round}">回</th>
                <th th:text="#{field.format}">形式</th>
                <th th:text="#{field.result}">結果</th>
                <th th:text="#{field.memo}">メモ</th>
                <th th:text="#{common.actions}">操作</th>
            </tr>
            </thead>
            <tbody>
            <!-- これからの面接は藍で強調 -->
            <tr th:each="i : ${interviews}"
                th:with="upcoming=${i.scheduledAt.isAfter(now)}"
                th:classappend="${upcoming} ? 'table-primary' : ''">
                <td class="text-nowrap">
                    <span th:text="${#temporals.format(i.scheduledAt, #messages.msg('fmt.dateTime'))}">2026/10/20 10:00</span>
                    <span class="badge bg-primary ms-1" th:if="${upcoming}" th:text="#{badge.planned}">予定</span>
                </td>
                <td class="fw-medium" th:text="${i.application.company.name}">企業名</td>
                <td th:text="${i.application.position}">職種</td>
                <td class="text-nowrap" th:text="#{interview.round(${i.round})}">第1次</td>
                <td th:text="${#messages.msg('format.' + i.format.name())}">オンライン</td>
                <td>
                    <span class="badge"
                          th:classappend="${i.result.name() == 'PASSED'} ? 'bg-success' : (${i.result.name() == 'FAILED'} ? 'bg-secondary' : 'bg-warning text-dark')"
                          th:text="${#messages.msg('result.' + i.result.name())}">結果待ち</span>
                </td>
                <td th:text="${i.notes}" style="white-space: pre-wrap;">メモ</td>
                <td class="text-nowrap">
                    <a th:href="@{/interviews/{id}/edit(id=${i.id})}" class="btn btn-sm btn-outline-secondary" th:text="#{common.edit}">編集</a>
                    <a th:href="@{/applications/{id}/ai-questions(id=${i.application.id})}" class="btn btn-sm btn-outline-primary"
                       th:title="#{ai.questions.hint}" th:text="#{ai.questions.short}">質問</a>
                    <form th:action="@{/interviews/{id}/delete(id=${i.id})}" method="post" class="d-inline"
                          th:attr="data-confirm=#{interview.confirmDelete}">
                        <button type="submit" class="btn btn-sm btn-outline-danger" th:text="#{common.delete}">削除</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
