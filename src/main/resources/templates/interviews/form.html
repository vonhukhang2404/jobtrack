<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${interviewId == null} ? '面接登録 | JobTrack' : '面接編集 | JobTrack'">面接登録 | JobTrack</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav th:replace="~{fragments/header :: navbar}"></nav>
<div class="container" style="max-width: 600px;">
    <h1 class="h3 mb-4" th:text="${interviewId == null} ? '面接登録' : '面接編集'">面接登録</h1>

    <div class="alert alert-warning" th:if="${applications.isEmpty()}">
        先に<a th:href="@{/applications/new}">応募を登録</a>してください。
    </div>

    <form th:action="${interviewId == null} ? @{/interviews} : @{/interviews/{id}(id=${interviewId})}"
          th:object="${interviewForm}" method="post">

        <div class="mb-3">
            <label class="form-label">応募 <span class="text-danger">*</span></label>
            <select th:field="*{applicationId}" class="form-select">
                <option value="">選択してください</option>
                <option th:each="a : ${applications}" th:value="${a.id}"
                        th:text="${a.company.name} + '（' + ${a.position} + '）'">企業名（職種）</option>
            </select>
            <div class="text-danger small" th:errors="*{applicationId}"></div>
        </div>

        <div class="row">
            <div class="col-4 mb-3">
                <label class="form-label">何次面接 <span class="text-danger">*</span></label>
                <div class="input-group">
                    <span class="input-group-text">第</span>
                    <input type="number" min="1" th:field="*{round}" class="form-control">
                    <span class="input-group-text">次</span>
                </div>
                <div class="text-danger small" th:errors="*{round}"></div>
            </div>
            <div class="col-8 mb-3">
                <label class="form-label">日時 <span class="text-danger">*</span></label>
                <input type="datetime-local" th:field="*{scheduledAt}" class="form-control">
                <div class="text-danger small" th:errors="*{scheduledAt}"></div>
            </div>
        </div>

        <div class="row">
            <div class="col-6 mb-3">
                <label class="form-label">形式 <span class="text-danger">*</span></label>
                <select th:field="*{format}" class="form-select">
                    <option th:each="f : ${formats}" th:value="${f}" th:text="${f.label}">オンライン</option>
                </select>
                <div class="text-danger small" th:errors="*{format}"></div>
            </div>
            <div class="col-6 mb-3">
                <label class="form-label">結果 <span class="text-danger">*</span></label>
                <select th:field="*{result}" class="form-select">
                    <option th:each="r : ${results}" th:value="${r}" th:text="${r.label}">結果待ち</option>
                </select>
                <div class="text-danger small" th:errors="*{result}"></div>
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label">メモ（聞かれたこと・反省点）</label>
            <textarea th:field="*{notes}" rows="6" class="form-control"
                      placeholder="例：志望動機を深掘りされた。OOPの説明は良かった。逆質問を準備しておく。"></textarea>
        </div>

        <button type="submit" class="btn btn-primary"
                th:text="${interviewId == null} ? '登録する' : '更新する'">登録する</button>
    </form>

    <p class="mt-3"><a th:href="@{/interviews}">← 一覧へ</a></p>
</div>
</body>
</html>
