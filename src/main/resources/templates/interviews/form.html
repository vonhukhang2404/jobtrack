<!DOCTYPE html>
<html lang="ja" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="(${interviewId == null} ? #{interview.new} : #{interview.edit}) + ' | JobTrack'">面接登録 | JobTrack</title>
    <th:block th:replace="~{fragments/header :: assets}"></th:block>
</head>
<body>
<header th:replace="~{fragments/header :: navbar}"></header>
<main class="container pb-5" style="max-width: 640px;">
    <div class="jt-page-head">
        <h1 th:text="${interviewId == null} ? #{interview.new} : #{interview.edit}">面接登録</h1>
    </div>

    <div class="alert alert-warning" th:if="${applications.isEmpty()}">
        <a th:href="@{/applications/new}" th:text="#{common.needApplication}">先に応募を登録してください。</a>
    </div>

    <form class="jt-box p-4" th:action="${interviewId == null} ? @{/interviews} : @{/interviews/{id}(id=${interviewId})}"
          th:object="${interviewForm}" method="post">
        <div class="mb-3">
            <label class="form-label" th:for="applicationId"><span th:text="#{field.application}">応募</span> <span class="text-danger">*</span></label>
            <select th:field="*{applicationId}" class="form-select">
                <option value="" th:text="#{common.select}">選択してください</option>
                <option th:each="a : ${applications}" th:value="${a.id}"
                        th:text="${a.company.name} + '（' + ${a.position} + '）'">企業名（職種）</option>
            </select>
            <div class="text-danger small" th:errors="*{applicationId}"></div>
        </div>

        <div class="row">
            <div class="col-sm-4 mb-3">
                <label class="form-label" th:for="round"><span th:text="#{interview.roundLabel}">何次面接</span> <span class="text-danger">*</span></label>
                <input type="number" min="1" th:field="*{round}" class="form-control">
                <div class="text-danger small" th:errors="*{round}"></div>
            </div>
            <div class="col-sm-8 mb-3">
                <label class="form-label" th:for="scheduledAt"><span th:text="#{field.datetime}">日時</span> <span class="text-danger">*</span></label>
                <input type="datetime-local" th:field="*{scheduledAt}" class="form-control">
                <div class="text-danger small" th:errors="*{scheduledAt}"></div>
            </div>
        </div>

        <div class="row">
            <div class="col-6 mb-3">
                <label class="form-label" th:for="format"><span th:text="#{field.format}">形式</span> <span class="text-danger">*</span></label>
                <select th:field="*{format}" class="form-select">
                    <option th:each="f : ${formats}" th:value="${f}" th:text="${#messages.msg('format.' + f.name())}">オンライン</option>
                </select>
                <div class="text-danger small" th:errors="*{format}"></div>
            </div>
            <div class="col-6 mb-3">
                <label class="form-label" th:for="result"><span th:text="#{field.result}">結果</span> <span class="text-danger">*</span></label>
                <select th:field="*{result}" class="form-select">
                    <option th:each="r : ${results}" th:value="${r}" th:text="${#messages.msg('result.' + r.name())}">結果待ち</option>
                </select>
                <div class="text-danger small" th:errors="*{result}"></div>
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label" th:for="notes" th:text="#{interview.notesLabel}">メモ（聞かれたこと・反省点）</label>
            <textarea th:field="*{notes}" rows="6" class="form-control" th:placeholder="#{interview.notesPlaceholder}"></textarea>
        </div>

        <button type="submit" class="btn btn-primary px-4"
                th:text="${interviewId == null} ? #{common.register} : #{common.update}">登録する</button>
    </form>

    <p class="mt-3"><a th:href="@{/interviews}" th:text="#{common.backToList}">← 一覧へ</a></p>
</main>
</body>
</html>
