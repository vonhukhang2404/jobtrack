<!DOCTYPE html>
<html lang="ja" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="(${taskId == null} ? #{task.new} : #{task.edit}) + ' | JobTrack'">タスク登録 | JobTrack</title>
    <th:block th:replace="~{fragments/header :: assets}"></th:block>
</head>
<body>
<header th:replace="~{fragments/header :: navbar}"></header>
<main class="container pb-5" style="max-width: 640px;">
    <div class="jt-page-head">
        <h1 th:text="${taskId == null} ? #{task.new} : #{task.edit}">タスク登録</h1>
    </div>

    <div class="alert alert-warning" th:if="${applications.isEmpty()}">
        <a th:href="@{/applications/new}" th:text="#{common.needApplication}">先に応募を登録してください。</a>
    </div>

    <form class="jt-box p-4" th:action="${taskId == null} ? @{/tasks} : @{/tasks/{id}(id=${taskId})}"
          th:object="${taskForm}" method="post">
        <div class="mb-3">
            <label class="form-label" th:for="applicationId"><span th:text="#{field.application}">応募</span> <span class="text-danger">*</span></label>
            <select th:field="*{applicationId}" class="form-select">
                <option value="" th:text="#{common.select}">選択してください</option>
                <option th:each="a : ${applications}" th:value="${a.id}"
                        th:text="${a.company.name} + '（' + ${a.position} + '）'">企業名（職種）</option>
            </select>
            <div class="text-danger small" th:errors="*{applicationId}"></div>
        </div>
        <div class="mb-3">
            <label class="form-label" th:for="title"><span th:text="#{field.task}">タスク</span> <span class="text-danger">*</span></label>
            <input type="text" th:field="*{title}" class="form-control" th:placeholder="#{task.placeholder}">
            <div class="text-danger small" th:errors="*{title}"></div>
        </div>
        <div class="mb-3">
            <label class="form-label" th:for="dueDate"><span th:text="#{field.dueDate}">締切</span> <span class="text-danger">*</span></label>
            <input type="date" th:field="*{dueDate}" class="form-control">
            <div class="text-danger small" th:errors="*{dueDate}"></div>
        </div>
        <div class="form-check mb-3" th:if="${taskId != null}">
            <input type="checkbox" th:field="*{done}" class="form-check-input">
            <label class="form-check-label" th:for="${#ids.prev('done')}" th:text="#{task.done}">完了</label>
        </div>
        <button type="submit" class="btn btn-primary px-4"
                th:text="${taskId == null} ? #{common.register} : #{common.update}">登録する</button>
    </form>

    <p class="mt-3"><a th:href="@{/tasks}" th:text="#{common.backToList}">← 一覧へ</a></p>
</main>
</body>
</html>
