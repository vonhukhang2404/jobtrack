<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${taskId == null} ? 'タスク登録 | JobTrack' : 'タスク編集 | JobTrack'">タスク登録 | JobTrack</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav th:replace="~{fragments/header :: navbar}"></nav>
<div class="container" style="max-width: 600px;">
    <h1 class="h3 mb-4" th:text="${taskId == null} ? 'タスク登録' : 'タスク編集'">タスク登録</h1>

    <div class="alert alert-warning" th:if="${applications.isEmpty()}">
        先に<a th:href="@{/applications/new}">応募を登録</a>してください。
    </div>

    <form th:action="${taskId == null} ? @{/tasks} : @{/tasks/{id}(id=${taskId})}"
          th:object="${taskForm}" method="post">

        <div class="mb-3">
            <label class="form-label">応募 <span class="text-danger">*</span></label>
            <select th:field="*{applicationId}" class="form-select">
                <option value="">選択してください</option>
                <option th:each="a : ${applications}" th:value="${a.id}"
                        th:text="${a.company.name} + '（' + ${a.position} + '）'">企業名（職種）</option>
            </select>
            <div class="text-danger small" th:errors="*{applicationId}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">タスク <span class="text-danger">*</span></label>
            <input type="text" th:field="*{title}" class="form-control" placeholder="例：ES提出、SPI受検">
            <div class="text-danger small" th:errors="*{title}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">締切 <span class="text-danger">*</span></label>
            <input type="date" th:field="*{dueDate}" class="form-control">
            <div class="text-danger small" th:errors="*{dueDate}"></div>
        </div>

        <div class="form-check mb-3" th:if="${taskId != null}">
            <input type="checkbox" th:field="*{done}" class="form-check-input">
            <label class="form-check-label" th:for="${#ids.prev('done')}">完了</label>
        </div>

        <button type="submit" class="btn btn-primary"
                th:text="${taskId == null} ? '登録する' : '更新する'">登録する</button>
    </form>

    <p class="mt-3"><a th:href="@{/tasks}">← 一覧へ</a></p>
</div>
</body>
</html>
