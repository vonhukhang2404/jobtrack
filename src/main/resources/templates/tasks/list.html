<!DOCTYPE html>
<html lang="ja" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="#{task.list} + ' | JobTrack'">タスク一覧 | JobTrack</title>
    <th:block th:replace="~{fragments/header :: assets}"></th:block>
</head>
<body>
<header th:replace="~{fragments/header :: navbar}"></header>
<main class="container pb-5">
    <div class="jt-page-head">
        <h1 th:text="#{task.list}">タスク一覧</h1>
        <div class="d-flex flex-wrap gap-2">
            <a th:href="@{/calendar.ics}" class="btn btn-outline-secondary" th:text="#{common.exportIcs}">カレンダーに出力（.ics）</a>
            <a th:href="@{/tasks/new}" class="btn btn-primary" th:text="#{task.add}">＋ タスクを追加</a>
        </div>
    </div>
    <div class="alert alert-success" th:if="${message != null}" th:text="${message}">登録しました</div>

    <p class="text-muted" th:if="${tasks.isEmpty()}" th:text="#{task.empty}">まだタスクが登録されていません。</p>

    <div class="table-wrap" th:unless="${tasks.isEmpty()}">
        <table class="table table-hover align-middle">
            <thead>
            <tr>
                <th style="width: 6rem;" th:text="#{task.done}">完了</th>
                <th th:text="#{field.task}">タスク</th>
                <th th:text="#{field.companyName}">企業名</th>
                <th th:text="#{field.position}">職種</th>
                <th th:text="#{field.dueDate}">締切</th>
                <th th:text="#{common.actions}">操作</th>
            </tr>
            </thead>
            <tbody>
            <!-- 未完了で締切を過ぎたタスクは朱、完了したタスクはグレー -->
            <tr th:each="t : ${tasks}"
                th:with="overdue=${!t.done and t.dueDate.isBefore(today)}"
                th:classappend="${overdue} ? 'table-danger' : (${t.done} ? 'text-muted' : '')">
                <td>
                    <form th:action="@{/tasks/{id}/toggle(id=${t.id})}" method="post" class="m-0">
                        <button type="submit" class="btn btn-sm"
                                th:classappend="${t.done} ? 'btn-success' : 'btn-outline-secondary'"
                                th:attr="aria-pressed=${t.done}"
                                th:text="${t.done} ? #{task.doneMark} : #{task.todoMark}">未</button>
                    </form>
                </td>
                <td>
                    <span th:text="${t.title}" th:classappend="${t.done} ? 'text-decoration-line-through' : ''">タスク名</span>
                    <span class="badge bg-danger ms-1" th:if="${overdue}" th:text="#{badge.overdue}">期限切れ</span>
                </td>
                <td th:text="${t.application.company.name}">企業名</td>
                <td th:text="${t.application.position}">職種</td>
                <td class="text-nowrap" th:text="${#temporals.format(t.dueDate, #messages.msg('fmt.date'))}">締切</td>
                <td class="text-nowrap">
                    <a th:href="@{/tasks/{id}/edit(id=${t.id})}" class="btn btn-sm btn-outline-secondary" th:text="#{common.edit}">編集</a>
                    <form th:action="@{/tasks/{id}/delete(id=${t.id})}" method="post" class="d-inline"
                          th:attr="data-confirm=#{task.confirmDelete}">
                        <button type="submit" class="btn btn-sm btn-outline-danger" th:text="#{common.delete}">削除</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
