<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>タスク一覧 | JobTrack</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav th:replace="~{fragments/header :: navbar}"></nav>
<div class="container">
    <h1 class="h3 mb-3">タスク一覧</h1>
    <div class="alert alert-success" th:if="${message != null}" th:text="${message}">登録しました</div>
    <a th:href="@{/tasks/new}" class="btn btn-primary mb-3">＋ タスクを追加</a>
    <a th:href="@{/calendar.ics}" class="btn btn-outline-secondary mb-3 ms-2">📅 カレンダーに出力（.ics）</a>

    <p th:if="${tasks.isEmpty()}">まだタスクが登録されていません。</p>

    <table class="table table-hover bg-white align-middle" th:unless="${tasks.isEmpty()}">
        <thead>
        <tr>
            <th style="width: 6rem;">完了</th>
            <th>タスク</th>
            <th>企業名</th>
            <th>職種</th>
            <th>締切</th>
            <th>操作</th>
        </tr>
        </thead>
        <tbody>
        <!-- 未完了で締切を過ぎたタスクは赤、完了したタスクはグレーで表示 -->
        <tr th:each="t : ${tasks}"
            th:with="overdue=${!t.done and t.dueDate.isBefore(today)}"
            th:classappend="${overdue} ? 'table-danger' : (${t.done} ? 'text-muted' : '')">
            <td>
                <form th:action="@{/tasks/{id}/toggle(id=${t.id})}" method="post">
                    <button type="submit" class="btn btn-sm"
                            th:classappend="${t.done} ? 'btn-success' : 'btn-outline-secondary'"
                            th:text="${t.done} ? '済' : '未'">未</button>
                </form>
            </td>
            <td>
                <span th:text="${t.title}" th:classappend="${t.done} ? 'text-decoration-line-through' : ''">タスク名</span>
                <span class="badge bg-danger ms-1" th:if="${overdue}">期限切れ</span>
            </td>
            <td th:text="${t.application.company.name}">企業名</td>
            <td th:text="${t.application.position}">職種</td>
            <td th:text="${#temporals.format(t.dueDate, 'yyyy/MM/dd')}">締切</td>
            <td class="text-nowrap">
                <a th:href="@{/tasks/{id}/edit(id=${t.id})}" class="btn btn-sm btn-outline-secondary">編集</a>
                <form th:action="@{/tasks/{id}/delete(id=${t.id})}" method="post" class="d-inline"
                      onsubmit="return confirm('このタスクを削除しますか？');">
                    <button type="submit" class="btn btn-sm btn-outline-danger">削除</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
