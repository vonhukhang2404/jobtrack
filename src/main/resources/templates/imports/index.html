<!DOCTYPE html>
<html lang="ja" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="#{import.title} + ' | JobTrack'">資料の取り込み | JobTrack</title>
    <th:block th:replace="~{fragments/header :: assets}"></th:block>
</head>
<body>
<header th:replace="~{fragments/header :: navbar}"></header>
<main class="container pb-5" style="max-width: 1000px;">
    <div class="jt-page-head">
        <div>
            <h1 th:text="#{import.title}">資料の取り込み</h1>
            <p class="text-muted mb-0 mt-2" th:text="#{import.lead}">
                学校の説明会の案内や求人情報から、AIが企業ごとに整理します。確認してから「企業・応募・説明会タスク」をまとめて登録します。
            </p>
        </div>
    </div>

    <!-- 入力：ファイル or 貼り付け（確認画面を出しているときは折りたたむ） -->
    <details class="card mb-4" th:open="${companyImportForm == null}">
        <summary class="card-header" th:text="#{import.input}">資料を入力</summary>
        <div class="card-body">
            <form th:action="@{/imports/extract}" method="post" enctype="multipart/form-data">
                <div class="mb-3">
                    <label class="form-label" for="file" th:text="#{import.file}">ファイル（.docx / .txt、5MBまで）</label>
                    <input type="file" id="file" name="file" class="form-control" accept=".docx,.txt">
                </div>
                <div class="mb-3">
                    <label class="form-label" for="text" th:text="#{import.paste}">または、文章を貼り付け</label>
                    <textarea id="text" name="text" rows="8" class="form-control" th:maxlength="${maxLength}"
                              th:text="${text}" th:placeholder="#{import.pastePlaceholder}"></textarea>
                    <div class="form-text" th:text="#{import.fileFirst}">ファイルを選んだ場合は、ファイルの内容を使います。</div>
                </div>
                <button type="submit" class="btn btn-primary" th:text="#{import.run}">AIで整理する</button>
                <div class="form-text" th:text="#{ai.privacy.import}">資料の本文をAIに送信します。個人情報が含まれていないか確認してください。</div>
            </form>
        </div>
    </details>

    <div class="alert alert-danger" th:if="${importError != null}" th:text="${importError}">エラー</div>
    <div class="alert alert-warning" th:if="${importWarning != null}" th:text="${importWarning}">注意</div>

    <!-- 確認画面 -->
    <form th:if="${companyImportForm != null}" th:action="@{/imports}" th:object="${companyImportForm}" method="post">
        <h2 class="h5" th:text="#{import.result(${companyImportForm.items.size()})}">AIの整理結果（0 社）</h2>
        <p class="small text-muted" th:text="#{import.check}">
            AIは間違えることがあります。内容を確認・修正し、登録する企業にチェックしてください。
        </p>

        <div class="card mb-3" th:each="item, stat : *{items}">
            <div class="card-header d-flex flex-wrap align-items-center gap-2">
                <input type="checkbox" class="form-check-input m-0" th:field="*{items[__${stat.index}__].selected}"
                       th:attr="aria-label=#{ai.tasks.register}">
                <strong th:text="*{items[__${stat.index}__].name}">企業名</strong>
                <span class="badge bg-secondary" th:if="*{items[__${stat.index}__].existing}" th:text="#{import.existing}">登録済み</span>
                <a class="ms-auto small fw-normal" target="_blank" rel="noopener"
                   th:href="'https://www.google.com/search?q=' + ${#uris.escapeQueryParam(item.name + ' 新卒採用')}"
                   th:text="#{import.search}">公式サイト・採用情報を検索</a>
            </div>
            <div class="card-body">
                <input type="hidden" th:field="*{items[__${stat.index}__].existing}">
                <div class="row g-2">
                    <div class="col-md-5">
                        <label class="form-label small" th:for="${'items' + stat.index + '.name'}" th:text="#{field.companyName}">企業名</label>
                        <input type="text" class="form-control form-control-sm" th:field="*{items[__${stat.index}__].name}">
                        <div class="text-danger small" th:errors="*{items[__${stat.index}__].name}"></div>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label small" th:for="${'items' + stat.index + '.industry'}" th:text="#{field.industry}">業界</label>
                        <input type="text" class="form-control form-control-sm" th:field="*{items[__${stat.index}__].industry}">
                        <div class="text-danger small" th:errors="*{items[__${stat.index}__].industry}"></div>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label small" th:for="${'items' + stat.index + '.position'}" th:text="#{import.position}">職種（応募）</label>
                        <input type="text" class="form-control form-control-sm" th:field="*{items[__${stat.index}__].position}">
                        <div class="text-danger small" th:errors="*{items[__${stat.index}__].position}"></div>
                        <div class="form-text" th:unless="${item.existingPositions.isEmpty()}"
                             th:text="#{import.existingPositions(${#strings.listJoin(item.existingPositions, ' / ')})}">
                            既存の応募：職種（同じ職種なら、その応募を使います）
                        </div>
                        <input type="hidden" th:each="p, ps : ${item.existingPositions}"
                               th:name="|items[${stat.index}].existingPositions[${ps.index}]|" th:value="${p}">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label small" th:for="${'items' + stat.index + '.eventDate'}" th:text="#{import.eventDate}">説明会の日付（空ならタスクなし）</label>
                        <input type="date" class="form-control form-control-sm" th:field="*{items[__${stat.index}__].eventDate}">
                    </div>
                    <div class="col-md-9">
                        <label class="form-label small" th:for="${'items' + stat.index + '.taskTitle'}" th:text="#{import.taskTitle}">タスク名</label>
                        <input type="text" class="form-control form-control-sm" th:field="*{items[__${stat.index}__].taskTitle}">
                        <div class="text-danger small" th:errors="*{items[__${stat.index}__].taskTitle}"></div>
                    </div>
                    <div class="col-12">
                        <label class="form-label small" th:for="${'items' + stat.index + '.memo'}" th:text="#{import.memo}">企業のメモ</label>
                        <textarea rows="3" class="form-control form-control-sm" th:field="*{items[__${stat.index}__].memo}"></textarea>
                    </div>
                    <div class="col-12">
                        <details>
                            <summary class="small text-muted" th:text="#{import.jdText}">応募の求人票に入る内容（解説・想定質問に使えます）</summary>
                            <textarea rows="5" class="form-control form-control-sm mt-1" th:field="*{items[__${stat.index}__].jdText}"
                                      th:attr="aria-label=#{field.jdText}"></textarea>
                        </details>
                    </div>
                </div>
            </div>
        </div>

        <button type="submit" class="btn btn-success" th:text="#{import.save}">チェックした企業を登録</button>
    </form>
</main>
</body>
</html>
