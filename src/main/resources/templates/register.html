<!DOCTYPE html>
<html lang="ja" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="#{register.title} + ' | JobTrack'">新規登録 | JobTrack</title>
    <th:block th:replace="~{fragments/header :: assets}"></th:block>
</head>
<body>
<div class="jt-auth-tools">
    <div th:replace="~{fragments/header :: langTheme}"></div>
</div>
<main class="jt-auth">
    <span class="jt-brand jt-head">JobTrack<span>.</span></span>
    <h1 class="h4 mb-3 text-center" th:text="#{register.title}">新規登録</h1>

    <div class="jt-box p-4">
        <form th:action="@{/register}" th:object="${registerForm}" method="post">
            <div class="mb-3">
                <label class="form-label" th:for="name" th:text="#{field.name}">名前</label>
                <input type="text" th:field="*{name}" class="form-control" autocomplete="name">
                <div class="text-danger small" th:errors="*{name}"></div>
            </div>
            <div class="mb-3">
                <label class="form-label" th:for="email" th:text="#{field.email}">メールアドレス</label>
                <input type="email" th:field="*{email}" class="form-control" autocomplete="email">
                <div class="text-danger small" th:errors="*{email}"></div>
            </div>
            <div class="mb-3">
                <label class="form-label" th:for="password" th:text="#{register.password}">パスワード（8文字以上）</label>
                <input type="password" th:field="*{password}" class="form-control" autocomplete="new-password">
                <div class="text-danger small" th:errors="*{password}"></div>
            </div>
            <button type="submit" class="btn btn-primary w-100 py-2" th:text="#{register.submit}">登録</button>
        </form>
    </div>

    <p class="mt-3 text-center"><a th:href="@{/login}" th:text="#{register.toLogin}">ログインはこちら</a></p>
</main>
</body>
</html>
