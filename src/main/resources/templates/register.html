<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>新規登録 | JobTrack</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container" style="max-width: 400px; margin-top: 80px;">
    <h1 class="h3 mb-4 text-center">新規登録</h1>

    <form th:action="@{/register}" th:object="${registerForm}" method="post">
        <div class="mb-3">
            <label class="form-label">名前</label>
            <input type="text" th:field="*{name}" class="form-control">
            <div class="text-danger small" th:errors="*{name}"></div>
        </div>
        <div class="mb-3">
            <label class="form-label">メールアドレス</label>
            <input type="email" th:field="*{email}" class="form-control">
            <div class="text-danger small" th:errors="*{email}"></div>
        </div>
        <div class="mb-3">
            <label class="form-label">パスワード（8文字以上）</label>
            <input type="password" th:field="*{password}" class="form-control">
            <div class="text-danger small" th:errors="*{password}"></div>
        </div>
        <button type="submit" class="btn btn-primary w-100">登録</button>
    </form>

    <p class="mt-3 text-center"><a th:href="@{/login}">ログインはこちら</a></p>
</div>
</body>
</html>
