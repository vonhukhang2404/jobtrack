<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${shiftId == null} ? 'シフト登録 | JobTrack' : 'シフト編集 | JobTrack'">シフト登録 | JobTrack</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav th:replace="~{fragments/header :: navbar}"></nav>
<div class="container" style="max-width: 600px;">
    <h1 class="h3 mb-4" th:text="${shiftId == null} ? 'シフト登録' : 'シフト編集'">シフト登録</h1>

    <form th:action="${shiftId == null} ? @{/shifts} : @{/shifts/{id}(id=${shiftId})}"
          th:object="${shiftForm}" method="post">

        <div class="mb-3">
            <label class="form-label">勤務先 <span class="text-danger">*</span></label>
            <input type="text" th:field="*{workplace}" class="form-control" placeholder="例：ローソン 今里店">
            <div class="text-danger small" th:errors="*{workplace}"></div>
        </div>

        <div class="row">
            <div class="col-6 mb-3">
                <label class="form-label">開始 <span class="text-danger">*</span></label>
                <input type="datetime-local" th:field="*{startAt}" class="form-control">
                <div class="text-danger small" th:errors="*{startAt}"></div>
            </div>
            <div class="col-6 mb-3">
                <label class="form-label">終了 <span class="text-danger">*</span></label>
                <input type="datetime-local" th:field="*{endAt}" class="form-control">
                <div class="text-danger small" th:errors="*{endAt}"></div>
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label">メモ</label>
            <textarea th:field="*{memo}" rows="3" class="form-control"></textarea>
        </div>

        <button type="submit" class="btn btn-primary"
                th:text="${shiftId == null} ? '登録する' : '更新する'">登録する</button>
    </form>

    <p class="mt-3"><a th:href="@{/shifts}">← 一覧へ</a></p>
</div>
</body>
</html>
