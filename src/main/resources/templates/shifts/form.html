<!DOCTYPE html>
<html lang="ja" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="(${shiftId == null} ? #{shift.new} : #{shift.edit}) + ' | JobTrack'">シフト登録 | JobTrack</title>
    <th:block th:replace="~{fragments/header :: assets}"></th:block>
</head>
<body>
<header th:replace="~{fragments/header :: navbar}"></header>
<main class="container pb-5" style="max-width: 640px;">
    <div class="jt-page-head">
        <h1 th:text="${shiftId == null} ? #{shift.new} : #{shift.edit}">シフト登録</h1>
    </div>

    <form class="jt-box p-4" th:action="${shiftId == null} ? @{/shifts} : @{/shifts/{id}(id=${shiftId})}"
          th:object="${shiftForm}" method="post">
        <div class="mb-3">
            <label class="form-label" th:for="workplace"><span th:text="#{field.workplace}">勤務先</span> <span class="text-danger">*</span></label>
            <input type="text" th:field="*{workplace}" class="form-control" th:placeholder="#{shift.placeholder}">
            <div class="text-danger small" th:errors="*{workplace}"></div>
        </div>
        <div class="row">
            <div class="col-sm-6 mb-3">
                <label class="form-label" th:for="startAt"><span th:text="#{field.startAt}">開始</span> <span class="text-danger">*</span></label>
                <input type="datetime-local" th:field="*{startAt}" class="form-control">
                <div class="text-danger small" th:errors="*{startAt}"></div>
            </div>
            <div class="col-sm-6 mb-3">
                <label class="form-label" th:for="endAt"><span th:text="#{field.endAt}">終了</span> <span class="text-danger">*</span></label>
                <input type="datetime-local" th:field="*{endAt}" class="form-control">
                <div class="text-danger small" th:errors="*{endAt}"></div>
            </div>
        </div>
        <div class="mb-3">
            <label class="form-label" th:for="memo" th:text="#{field.memo}">メモ</label>
            <textarea th:field="*{memo}" rows="3" class="form-control"></textarea>
        </div>
        <button type="submit" class="btn btn-primary px-4"
                th:text="${shiftId == null} ? #{common.register} : #{common.update}">登録する</button>
    </form>

    <p class="mt-3"><a th:href="@{/shifts}" th:text="#{common.backToList}">← 一覧へ</a></p>
</main>
</body>
</html>
