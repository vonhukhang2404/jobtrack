<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${applicationId == null} ? '応募登録 | JobTrack' : '応募編集 | JobTrack'">応募登録 | JobTrack</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container" style="max-width: 600px; margin-top: 40px;">
    <h1 class="h3 mb-4" th:text="${applicationId == null} ? '応募登録' : '応募編集'">応募登録</h1>
    <div class="alert alert-warning" th:if="${companies.isEmpty()}">
        先に<a th:href="@{/companies/new}">企業を登録</a>してください。
    </div>

    <form th:action="${applicationId == null} ? @{/applications} : @{/applications/{id}(id=${applicationId})}"
          th:object="${applicationForm}" method="post">

        <!-- 企業 (dropdown) -->
        <div class="mb-3">
            <label class="form-label">企業 <span class="text-danger">*</span></label>
            <select th:field="*{companyId}" class="form-select">
                <option value="">選択してください</option>
                <option th:each="c : ${companies}" th:value="${c.id}" th:text="${c.name}">企業名</option>
            </select>
            <div class="text-danger small" th:errors="*{companyId}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">職種 <span class="text-danger">*</span></label>
            <input type="text" th:field="*{position}" class="form-control">
            <div class="text-danger small" th:errors="*{position}"></div>
        </div>

        <!-- ステータス (dropdown enum) -->
        <div class="mb-3">
            <label class="form-label">ステータス <span class="text-danger">*</span></label>
            <select th:field="*{status}" class="form-select">
                <option th:each="s : ${statuses}" th:value="${s}" th:text="${s.label}">ステータス</option>
            </select>
            <div class="text-danger small" th:errors="*{status}"></div>
        </div>

        <!-- 応募日 (ô chọn ngày) -->
        <div class="mb-3">
            <label class="form-label">応募日</label>
            <input type="date" th:field="*{appliedAt}" class="form-control">
        </div>

        <div class="mb-3">
            <label class="form-label">求人票</label>
            <textarea th:field="*{jdText}" rows="6" class="form-control"></textarea>
            <div class="text-danger small" th:errors="*{jdText}"></div>
        </div>

        <button type="submit" class="btn btn-primary"
                th:text="${applicationId == null} ? '登録する' : '更新する'">登録する</button>
    </form>

    <p class="mt-3"><a th:href="@{/applications}">← 一覧へ</a></p>
</div>
</body>
</html>
