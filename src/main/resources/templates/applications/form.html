<!DOCTYPE html>
<html lang="ja" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="(${applicationId == null} ? #{application.new} : #{application.edit}) + ' | JobTrack'">応募登録 | JobTrack</title>
    <th:block th:replace="~{fragments/header :: assets}"></th:block>
</head>
<body>
<header th:replace="~{fragments/header :: navbar}"></header>
<main class="container pb-5" style="max-width: 640px;">
    <div class="jt-page-head">
        <h1 th:text="${applicationId == null} ? #{application.new} : #{application.edit}">応募登録</h1>
    </div>
    <div class="alert alert-warning" th:if="${companies.isEmpty()}">
        <a th:href="@{/companies/new}" th:text="#{application.needCompany}">先に企業を登録してください。</a>
    </div>

    <form class="jt-box p-4" th:action="${applicationId == null} ? @{/applications} : @{/applications/{id}(id=${applicationId})}"
          th:object="${applicationForm}" method="post">
        <div class="mb-3">
            <label class="form-label" th:for="companyId"><span th:text="#{field.company}">企業</span> <span class="text-danger">*</span></label>
            <select th:field="*{companyId}" class="form-select">
                <option value="" th:text="#{common.select}">選択してください</option>
                <option th:each="c : ${companies}" th:value="${c.id}" th:text="${c.name}">企業名</option>
            </select>
            <div class="text-danger small" th:errors="*{companyId}"></div>
        </div>
        <div class="mb-3">
            <label class="form-label" th:for="position"><span th:text="#{field.position}">職種</span> <span class="text-danger">*</span></label>
            <input type="text" th:field="*{position}" class="form-control">
            <div class="text-danger small" th:errors="*{position}"></div>
        </div>
        <div class="mb-3">
            <label class="form-label" th:for="status"><span th:text="#{field.status}">ステータス</span> <span class="text-danger">*</span></label>
            <select th:field="*{status}" class="form-select">
                <option th:each="s : ${statuses}" th:value="${s}" th:text="${#messages.msg('status.' + s.name())}">ステータス</option>
            </select>
            <div class="text-danger small" th:errors="*{status}"></div>
        </div>
        <div class="mb-3">
            <label class="form-label" th:for="appliedAt" th:text="#{field.appliedAt}">応募日</label>
            <input type="date" th:field="*{appliedAt}" class="form-control">
        </div>
        <div class="mb-3">
            <label class="form-label" th:for="jdText" th:text="#{field.jdText}">求人票</label>
            <textarea th:field="*{jdText}" rows="6" class="form-control"></textarea>
            <div class="text-danger small" th:errors="*{jdText}"></div>
        </div>
        <button type="submit" class="btn btn-primary px-4"
                th:text="${applicationId == null} ? #{common.register} : #{common.update}">登録する</button>
    </form>

    <p class="mt-3"><a th:href="@{/applications}" th:text="#{common.backToList}">← 一覧へ</a></p>
</main>
</body>
</html>
