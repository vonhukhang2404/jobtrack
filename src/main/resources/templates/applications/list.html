<!DOCTYPE html>
<html lang="ja" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="#{nav.applications} + ' | JobTrack'">応募一覧 | JobTrack</title>
    <th:block th:replace="~{fragments/header :: assets}"></th:block>
</head>
<body>
<header th:replace="~{fragments/header :: navbar}"></header>
<main class="container pb-5">
    <div class="jt-page-head">
        <h1 th:text="#{nav.applications}">応募一覧</h1>
        <a th:href="@{/applications/new}" class="btn btn-primary" th:text="#{application.add}">＋ 応募を追加</a>
    </div>
    <div class="alert alert-success" th:if="${message != null}" th:text="${message}">登録しました</div>

    <p class="text-muted" th:if="${applications.isEmpty()}" th:text="#{application.empty}">まだ応募が登録されていません。</p>

    <div class="table-wrap" th:unless="${applications.isEmpty()}">
        <table class="table table-hover align-middle">
            <thead>
            <tr>
                <th th:text="#{field.companyName}">企業名</th>
                <th th:text="#{field.position}">職種</th>
                <th th:text="#{field.status}">ステータス</th>
                <th th:text="#{field.appliedAt}">応募日</th>
                <th th:text="#{common.actions}">操作</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="a : ${applications}">
                <td class="fw-medium" th:text="${a.company.name}">企業名</td>
                <td th:text="${#strings.abbreviate(a.position, 30)}" th:title="${a.position}">職種</td>
                <td th:text="${#messages.msg('status.' + a.status.name())}">ステータス</td>
                <td class="text-nowrap" th:text="${a.appliedAt != null} ? ${#temporals.format(a.appliedAt, #messages.msg('fmt.date'))} : ''">応募日</td>
                <td class="text-nowrap">
                    <a th:href="@{/applications/{id}/edit(id=${a.id})}" class="btn btn-sm btn-outline-secondary" th:text="#{common.edit}">編集</a>
                    <a th:href="@{/applications/{id}/ai-tasks(id=${a.id})}" class="btn btn-sm btn-outline-primary"
                       th:title="#{ai.tasks.hint}" th:text="#{ai.tasks.short}">締切</a>
                    <a th:href="@{/applications/{id}/ai-summary(id=${a.id})}" class="btn btn-sm btn-outline-primary"
                       th:title="#{ai.summary.hint}" th:text="#{ai.summary.short}">解説</a>
                    <a th:href="@{/applications/{id}/ai-questions(id=${a.id})}" class="btn btn-sm btn-outline-primary"
                       th:title="#{ai.questions.hint}" th:text="#{ai.questions.short}">質問</a>
                    <form th:action="@{/applications/{id}/delete(id=${a.id})}" method="post" class="d-inline"
                          th:attr="data-confirm=#{application.confirmDelete}">
                        <button type="submit" class="btn btn-sm btn-outline-danger" th:text="#{common.delete}">削除</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
