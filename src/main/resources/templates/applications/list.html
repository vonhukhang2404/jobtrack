<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>応募一覧 | JobTrack</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav th:replace="~{fragments/header :: navbar}"></nav>
<div class="container">
    <h1 class="h3 mb-3">応募一覧</h1>
    <a th:href="@{/applications/new}" class="btn btn-primary mb-3">＋ 応募を追加</a>

    <p th:if="${applications.isEmpty()}">まだ応募が登録されていません。</p>

    <table class="table table-hover bg-white" th:unless="${applications.isEmpty()}">
        <thead>
        <tr>
            <th>企業名</th>
            <th>職種</th>
            <th>ステータス</th>
            <th>応募日</th>
            <th>操作</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="a : ${applications}">
            <td th:text="${a.company.name}">企業名</td>
            <td th:text="${a.position}">職種</td>
            <td th:text="${a.status.label}">ステータス</td>
            <td th:text="${a.appliedAt != null} ? ${#temporals.format(a.appliedAt, 'yyyy/MM/dd')} : ''">応募日</td>
            <td class="text-nowrap">
                <a th:href="@{/applications/{id}/edit(id=${a.id})}" class="btn btn-sm btn-outline-secondary">編集</a>

                <form th:action="@{/applications/{id}/delete(id=${a.id})}" method="post" class="d-inline"
                      onsubmit="return confirm('この応募を削除しますか？\n関連する面接・タスクも削除されます。');">
                    <button type="submit" class="btn btn-sm btn-outline-danger">削除</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>

</div>
</body>
</html>
