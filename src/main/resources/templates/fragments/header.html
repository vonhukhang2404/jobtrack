<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <!-- 共通の <head> 部品：各ページで <th:block th:replace="~{fragments/header :: assets}"></th:block> -->
    <th:block th:fragment="assets">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <!-- テーマを描画前に決める（保存したテーマ → なければ OS の設定）。ちらつき防止のため最初に実行 -->
        <script>
            (function () {
                var t = 'light';
                try {
                    t = localStorage.getItem('jt-theme');
                    if (t !== 'dark' && t !== 'light') {
                        t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
                    }
                } catch (e) { t = 'light'; }
                document.documentElement.setAttribute('data-bs-theme', t);
            })();
        </script>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Shippori+Mincho:wght@600;700&family=Be+Vietnam+Pro:wght@400;500;700&family=Noto+Serif:wght@600;700&display=swap" rel="stylesheet">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link th:href="@{/css/jobtrack.css}" rel="stylesheet">
        <script th:src="@{/js/theme.js}" defer></script>
    </th:block>
</head>
<body>

<!-- 言語（JA / EN / VI）とテーマ（ライト / ダーク）の切り替え -->
<div th:fragment="langTheme" class="d-flex align-items-center gap-2">
    <div class="jt-seg" role="group" aria-label="Language">
        <a href="?lang=ja" lang="ja" th:classappend="${#locale.language == 'ja'} ? 'active'"
           th:attr="aria-current=${#locale.language == 'ja'} ? 'true' : null" title="日本語">JA</a>
        <a href="?lang=en" lang="en" th:classappend="${#locale.language == 'en'} ? 'active'"
           th:attr="aria-current=${#locale.language == 'en'} ? 'true' : null" title="English">EN</a>
        <a href="?lang=vi" lang="vi" th:classappend="${#locale.language == 'vi'} ? 'active'"
           th:attr="aria-current=${#locale.language == 'vi'} ? 'true' : null" title="Tiếng Việt">VI</a>
    </div>
    <button type="button" class="jt-ghost" data-jt-theme-toggle aria-pressed="false">
        <span class="jt-only-light jt-icon-text">
            <svg aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
            <span class="jt-label" th:text="#{theme.dark}">ダーク</span>
        </span>
        <span class="jt-only-dark jt-icon-text">
            <svg aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
            <span class="jt-label" th:text="#{theme.light}">ライト</span>
        </span>
    </button>
</div>

<!-- 共通ナビゲーションバー: 各ページで th:replace="~{fragments/header :: navbar}" で読み込む -->
<header th:fragment="navbar" class="jt-header">
    <div class="container">
        <a class="jt-brand" th:href="@{/}">JobTrack<span>.</span></a>

        <nav style="flex: 1" th:attr="aria-label=#{nav.menu}" sec:authorize="isAuthenticated()">
            <ul class="jt-nav">
                <li><a th:href="@{/}" th:classappend="${currentPath == '/'} ? 'active'" th:text="#{nav.dashboard}">ダッシュボード</a></li>
                <li><a th:href="@{/companies}" th:classappend="${currentPath != null and currentPath.startsWith('/companies')} ? 'active'" th:text="#{nav.companies}">企業一覧</a></li>
                <li><a th:href="@{/applications}" th:classappend="${currentPath != null and currentPath.startsWith('/applications')} ? 'active'" th:text="#{nav.applications}">応募一覧</a></li>
                <li><a th:href="@{/interviews}" th:classappend="${currentPath != null and currentPath.startsWith('/interviews')} ? 'active'" th:text="#{nav.interviews}">面接</a></li>
                <li><a th:href="@{/tasks}" th:classappend="${currentPath != null and currentPath.startsWith('/tasks')} ? 'active'" th:text="#{nav.tasks}">タスク</a></li>
                <li><a th:href="@{/shifts}" th:classappend="${currentPath != null and currentPath.startsWith('/shifts')} ? 'active'" th:text="#{nav.shifts}">シフト</a></li>
                <li><a th:href="@{/imports}" th:classappend="${currentPath != null and currentPath.startsWith('/imports')} ? 'active'" th:text="#{nav.imports}">取り込み</a></li>
            </ul>
        </nav>

        <div class="jt-tools">
            <div th:replace="~{fragments/header :: langTheme}"></div>
            <span class="jt-user" sec:authorize="isAuthenticated()" sec:authentication="name">user@example.com</span>
            <form th:action="@{/logout}" method="post" class="m-0" sec:authorize="isAuthenticated()">
                <button type="submit" class="jt-ghost" th:text="#{nav.logout}">ログアウト</button>
            </form>
        </div>
    </div>
</header>

</body>
</html>
