<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>JobTrack</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav th:replace="~{fragments/header :: navbar}"></nav>
<div class="container">
    <h1 class="h3 mb-1">JobTrack</h1>
    <p class="text-muted mb-4">就活管理システム</p>

    <div class="row g-3">
        <div class="col-md-6">
            <a th:href="@{/companies}" class="card text-decoration-none h-100">
                <div class="card-body">
                    <h2 class="h5 card-title">企業一覧</h2>
                    <p class="card-text text-muted">志望企業の登録・編集・削除</p>
                </div>
            </a>
        </div>
        <div class="col-md-6">
            <a th:href="@{/applications}" class="card text-decoration-none h-100">
                <div class="card-body">
                    <h2 class="h5 card-title">応募一覧</h2>
                    <p class="card-text text-muted">応募状況（ステータス・応募日）の管理</p>
                </div>
            </a>
        </div>
    </div>
</div>
</body>
</html>
