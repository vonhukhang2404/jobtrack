<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>企業一覧 | JobTrack</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-4">
    <h1 class="h3 mb-3">企業一覧</h1>

    <p th:if="${companies.isEmpty()}">まだ企業が登録されていません。</p>

    <table class="table table-hover bg-white" th:unless="${companies.isEmpty()}">
        <thead>
        <tr>
            <th>企業名</th>
            <th>業界</th>
            <th>URL</th>
            <th>メモ</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="c : ${companies}">
            <td th:text="${c.name}">企業名</td>
            <td th:text="${c.industry}">業界</td>
            <td><a th:if="${c.url}" th:href="${c.url}" th:text="${c.url}" target="_blank">URL</a></td>
            <td th:text="${c.memo}">メモ</td>
        </tr>
        </tbody>
    </table>

    <a th:href="@{/}">← トップへ</a>
</div>
</body>
</html>
