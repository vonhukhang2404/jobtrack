<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>企業一覧 | JobTrack</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav th:replace="~{fragments/header :: navbar}"></nav>
<div class="container">
    <h1 class="h3 mb-3">企業一覧</h1>
    <a th:href="@{/companies/new}" class="btn btn-primary mb-3">＋ 企業を追加</a>

    <p th:if="${companies.isEmpty()}">まだ企業が登録されていません。</p>

    <table class="table table-hover bg-white" th:unless="${companies.isEmpty()}">
        <thead>
        <tr>
            <th>企業名</th>
            <th>業界</th>
            <th>URL</th>
            <th>メモ</th>
            <th>操作</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="c : ${companies}">
            <td th:text="${c.name}">企業名</td>
            <td th:text="${c.industry}">業界</td>
            <td><a th:if="${c.url}" th:href="${c.url}" th:text="${c.url}" target="_blank">URL</a></td>
            <td th:text="${c.memo}" style="white-space: pre-wrap;">メモ</td>
            <td class="text-nowrap">
                <a th:href="@{/companies/{id}/edit(id=${c.id})}" class="btn btn-sm btn-outline-secondary">編集</a>

                <form th:action="@{/companies/{id}/delete(id=${c.id})}" method="post" class="d-inline"
                      onsubmit="return confirm('この企業を削除しますか？\n関連する応募情報も削除されます。');">
                    <button type="submit" class="btn btn-sm btn-outline-danger">削除</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>

</div>
</body>
</html>
