<!DOCTYPE html>
<html lang="ja" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="#{nav.companies} + ' | JobTrack'">企業一覧 | JobTrack</title>
    <th:block th:replace="~{fragments/header :: assets}"></th:block>
</head>
<body>
<header th:replace="~{fragments/header :: navbar}"></header>
<main class="container pb-5">
    <div class="jt-page-head">
        <h1 th:text="#{nav.companies}">企業一覧</h1>
        <a th:href="@{/companies/new}" class="btn btn-primary" th:text="#{company.add}">＋ 企業を追加</a>
    </div>

    <p class="text-muted" th:if="${companies.isEmpty()}" th:text="#{company.empty}">まだ企業が登録されていません。</p>

    <div class="table-wrap" th:unless="${companies.isEmpty()}">
        <table class="table table-hover align-middle">
            <thead>
            <tr>
                <th th:text="#{field.companyName}">企業名</th>
                <th th:text="#{field.industry}">業界</th>
                <th>URL</th>
                <th th:text="#{field.memo}">メモ</th>
                <th th:text="#{common.actions}">操作</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="c : ${companies}">
                <td class="fw-medium" th:text="${c.name}">企業名</td>
                <td th:text="${c.industry}">業界</td>
                <td><a th:if="${c.url}" th:href="${c.url}" th:text="${c.url}" target="_blank" rel="noopener">URL</a></td>
                <td th:text="${c.memo}" style="white-space: pre-wrap;">メモ</td>
                <td class="text-nowrap">
                    <a th:href="@{/companies/{id}/edit(id=${c.id})}" class="btn btn-sm btn-outline-secondary" th:text="#{common.edit}">編集</a>
                    <form th:action="@{/companies/{id}/delete(id=${c.id})}" method="post" class="d-inline"
                          th:attr="data-confirm=#{company.confirmDelete}">
                        <button type="submit" class="btn btn-sm btn-outline-danger" th:text="#{common.delete}">削除</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
