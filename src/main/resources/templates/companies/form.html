<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${companyId == null} ? '企業登録 | JobTrack' : '企業編集 | JobTrack'">企業登録 | JobTrack</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav th:replace="~{fragments/header :: navbar}"></nav>
<div class="container" style="max-width: 600px;">
    <h1 class="h3 mb-4" th:text="${companyId == null} ? '企業登録' : '企業編集'">企業登録</h1>

    <form th:action="${companyId == null} ? @{/companies} : @{/companies/{id}(id=${companyId})}"
          th:object="${companyForm}" method="post">
        <div class="mb-3">
            <label class="form-label">企業名 <span class="text-danger">*</span></label>
            <input type="text" th:field="*{name}" class="form-control">
            <div class="text-danger small" th:errors="*{name}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">業界</label>
            <input type="text" th:field="*{industry}" class="form-control">
            <div class="text-danger small" th:errors="*{industry}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">URL</label>
            <input type="url" th:field="*{url}" class="form-control">
            <div class="text-danger small" th:errors="*{url}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">メモ</label>
            <textarea th:field="*{memo}" rows="4" class="form-control"></textarea>
        </div>

        <button type="submit" class="btn btn-primary"
                th:text="${companyId == null} ? '登録する' : '更新する'">登録する</button>
    </form>

    <p class="mt-3"><a th:href="@{/companies}">← 一覧へ</a></p>
</div>
</body>
</html>
