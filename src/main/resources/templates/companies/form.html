<!DOCTYPE html>
<html lang="ja" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="(${companyId == null} ? #{company.new} : #{company.edit}) + ' | JobTrack'">企業登録 | JobTrack</title>
    <th:block th:replace="~{fragments/header :: assets}"></th:block>
</head>
<body>
<header th:replace="~{fragments/header :: navbar}"></header>
<main class="container pb-5" style="max-width: 640px;">
    <div class="jt-page-head">
        <h1 th:text="${companyId == null} ? #{company.new} : #{company.edit}">企業登録</h1>
    </div>

    <form class="jt-box p-4" th:action="${companyId == null} ? @{/companies} : @{/companies/{id}(id=${companyId})}"
          th:object="${companyForm}" method="post">
        <div class="mb-3">
            <label class="form-label" th:for="name"><span th:text="#{field.companyName}">企業名</span> <span class="text-danger">*</span></label>
            <input type="text" th:field="*{name}" class="form-control">
            <div class="text-danger small" th:errors="*{name}"></div>
        </div>
        <div class="mb-3">
            <label class="form-label" th:for="industry" th:text="#{field.industry}">業界</label>
            <input type="text" th:field="*{industry}" class="form-control">
            <div class="text-danger small" th:errors="*{industry}"></div>
        </div>
        <div class="mb-3">
            <label class="form-label" th:for="url">URL</label>
            <input type="url" th:field="*{url}" class="form-control">
            <div class="text-danger small" th:errors="*{url}"></div>
        </div>
        <div class="mb-3">
            <label class="form-label" th:for="memo" th:text="#{field.memo}">メモ</label>
            <textarea th:field="*{memo}" rows="4" class="form-control"></textarea>
        </div>
        <button type="submit" class="btn btn-primary px-4"
                th:text="${companyId == null} ? #{common.register} : #{common.update}">登録する</button>
    </form>

    <p class="mt-3"><a th:href="@{/companies}" th:text="#{common.backToList}">← 一覧へ</a></p>
</main>
</body>
</html>
