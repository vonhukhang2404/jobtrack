<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>求人票の解説 | JobTrack</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav th:replace="~{fragments/header :: navbar}"></nav>
<div class="container" style="max-width: 900px;">
    <h1 class="h3 mb-1">📖 求人票の解説</h1>
    <p class="text-muted mb-4">
        <span th:text="${jobApplication.company.name}">企業名</span>（<span th:text="${jobApplication.position}">職種</span>）
    </p>

    <!-- 求人票（解説を表示しているときは折りたたむ） -->
    <details class="card mb-4" th:open="${summary == null}">
        <summary class="card-header">求人票（原文）</summary>
        <div class="card-body">
            <p class="mb-0" style="white-space: pre-wrap; max-height: 250px; overflow-y: auto;"
               th:if="${jobApplication.jdText != null and !jobApplication.jdText.isBlank()}"
               th:text="${jobApplication.jdText}">求人票の本文</p>
            <p class="text-muted mb-0" th:if="${jobApplication.jdText == null or jobApplication.jdText.isBlank()}">
                求人票が登録されていません。
                <a th:href="@{/applications/{id}/edit(id=${jobApplication.id})}">応募の編集画面</a>で貼り付けてください。
            </p>
        </div>
    </details>

    <!-- 言語を選んで解説 -->
    <form th:if="${jobApplication.jdText != null and !jobApplication.jdText.isBlank()}"
          th:action="@{/applications/{id}/ai-summary(id=${jobApplication.id})}" method="post" class="mb-3">
        <span class="me-2">解説の言語：</span>
        <button th:each="lang : ${languages}" type="submit" name="language" th:value="${lang}"
                class="btn me-2"
                th:classappend="${lang == selectedLanguage} ? 'btn-primary' : 'btn-outline-primary'"
                th:text="${lang.label}">やさしい日本語</button>
        <div class="form-text">求人票の本文だけをAIに送信します。個人情報は送信しません。</div>
    </form>

    <!-- エラー -->
    <div class="alert alert-danger" th:if="${aiError != null}" th:text="${aiError}">エラー</div>

    <!-- 解説 -->
    <div th:if="${summary != null}">
        <p class="small text-muted">AIによる解説です。間違いがある場合もあるので、大事なことは原文で確認してください。</p>

        <div class="card mb-3" th:if="${!summary.summary().isEmpty()}">
            <div class="card-header">💡 どんな仕事？</div>
            <div class="card-body"><p class="mb-0" th:text="${summary.summary()}">要約</p></div>
        </div>

        <div class="row">
            <div class="col-md-6 mb-3" th:if="${!summary.work().isEmpty()}">
                <div class="card h-100">
                    <div class="card-header">🛠 仕事内容</div>
                    <ul class="list-group list-group-flush">
                        <li class="list-group-item" th:each="item : ${summary.work()}" th:text="${item}">項目</li>
                    </ul>
                </div>
            </div>
            <div class="col-md-6 mb-3" th:if="${!summary.skills().isEmpty()}">
                <div class="card h-100">
                    <div class="card-header">📚 必要なスキル</div>
                    <ul class="list-group list-group-flush">
                        <li class="list-group-item" th:each="item : ${summary.skills()}" th:text="${item}">項目</li>
                    </ul>
                </div>
            </div>
            <div class="col-md-6 mb-3" th:if="${!summary.conditions().isEmpty()}">
                <div class="card h-100">
                    <div class="card-header">🏢 条件</div>
                    <ul class="list-group list-group-flush">
                        <li class="list-group-item" th:each="item : ${summary.conditions()}" th:text="${item}">項目</li>
                    </ul>
                </div>
            </div>
            <div class="col-md-6 mb-3" th:if="${!summary.prepare().isEmpty()}">
                <div class="card h-100 border-success">
                    <div class="card-header">✅ 面接までに準備すること</div>
                    <ul class="list-group list-group-flush">
                        <li class="list-group-item" th:each="item : ${summary.prepare()}" th:text="${item}">項目</li>
                    </ul>
                </div>
            </div>
        </div>
    </div>

    <p class="mt-4">
        <a th:href="@{/applications}">← 応募一覧へ</a>
        <a class="ms-3" th:href="@{/applications/{id}/ai-questions(id=${jobApplication.id})}">💬 想定質問を作る →</a>
    </p>
</div>
</body>
</html>
