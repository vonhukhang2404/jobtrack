<!DOCTYPE html>
<html lang="ja" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="#{ai.summary.title} + ' | JobTrack'">求人票の解説 | JobTrack</title>
    <th:block th:replace="~{fragments/header :: assets}"></th:block>
</head>
<body>
<header th:replace="~{fragments/header :: navbar}"></header>
<main class="container pb-5" style="max-width: 900px;">
    <div class="jt-page-head">
        <div>
            <p class="jt-eyebrow">
                <span th:text="${jobApplication.company.name}">企業名</span>（<span th:text="${jobApplication.position}">職種</span>）
            </p>
            <h1 th:text="#{ai.summary.title}">求人票の解説</h1>
        </div>
    </div>

    <!-- 求人票（解説を表示しているときは折りたたむ） -->
    <details class="card mb-4" th:open="${summary == null}">
        <summary class="card-header" th:text="#{ai.summary.original}">求人票（原文）</summary>
        <div class="card-body">
            <p class="mb-0" style="white-space: pre-wrap; max-height: 250px; overflow-y: auto;"
               th:if="${jobApplication.jdText != null and !jobApplication.jdText.isBlank()}"
               th:text="${jobApplication.jdText}">求人票の本文</p>
            <p class="text-muted mb-0" th:if="${jobApplication.jdText == null or jobApplication.jdText.isBlank()}">
                <span th:text="#{ai.noJd}">求人票が登録されていません。</span>
                <a th:href="@{/applications/{id}/edit(id=${jobApplication.id})}" th:text="#{ai.noJdLink}">応募の編集画面で貼り付けてください。</a>
            </p>
        </div>
    </details>

    <!-- 言語を選んで解説（AIの出力の言語。画面の言語とは別） -->
    <form th:if="${jobApplication.jdText != null and !jobApplication.jdText.isBlank()}"
          th:action="@{/applications/{id}/ai-summary(id=${jobApplication.id})}" method="post" class="mb-3">
        <span class="me-2" th:text="#{ai.summary.language}">解説の言語：</span>
        <button th:each="lang : ${languages}" type="submit" name="language" th:value="${lang}"
                class="btn me-2"
                th:classappend="${lang == selectedLanguage} ? 'btn-primary' : 'btn-outline-primary'"
                th:text="${#messages.msg('summaryLang.' + lang.name())}">やさしい日本語</button>
        <div class="form-text" th:text="#{ai.privacy.jd}">求人票の本文だけをAIに送信します。個人情報は送信しません。</div>
    </form>

    <div class="alert alert-danger" th:if="${aiError != null}" th:text="${aiError}">エラー</div>

    <!-- 解説 -->
    <div th:if="${summary != null}">
        <p class="small text-muted" th:text="#{ai.summary.disclaimer}">AIによる解説です。間違いがある場合もあるので、大事なことは原文で確認してください。</p>

        <div class="card mb-3" th:if="${!summary.summary().isEmpty()}">
            <div class="card-header" th:text="#{ai.summary.what}">どんな仕事？</div>
            <div class="card-body"><p class="mb-0" th:text="${summary.summary()}">要約</p></div>
        </div>

        <div class="row">
            <div class="col-md-6 mb-3" th:if="${!summary.work().isEmpty()}">
                <div class="card h-100">
                    <div class="card-header" th:text="#{ai.summary.work}">仕事内容</div>
                    <ul class="list-group list-group-flush">
                        <li class="list-group-item" th:each="item : ${summary.work()}" th:text="${item}">項目</li>
                    </ul>
                </div>
            </div>
            <div class="col-md-6 mb-3" th:if="${!summary.skills().isEmpty()}">
                <div class="card h-100">
                    <div class="card-header" th:text="#{ai.summary.skills}">必要なスキル</div>
                    <ul class="list-group list-group-flush">
                        <li class="list-group-item" th:each="item : ${summary.skills()}" th:text="${item}">項目</li>
                    </ul>
                </div>
            </div>
            <div class="col-md-6 mb-3" th:if="${!summary.conditions().isEmpty()}">
                <div class="card h-100">
                    <div class="card-header" th:text="#{ai.summary.conditions}">条件</div>
                    <ul class="list-group list-group-flush">
                        <li class="list-group-item" th:each="item : ${summary.conditions()}" th:text="${item}">項目</li>
                    </ul>
                </div>
            </div>
            <div class="col-md-6 mb-3" th:if="${!summary.prepare().isEmpty()}">
                <div class="card h-100 border-success">
                    <div class="card-header" th:text="#{ai.summary.prepare}">面接までに準備すること</div>
                    <ul class="list-group list-group-flush">
                        <li class="list-group-item" th:each="item : ${summary.prepare()}" th:text="${item}">項目</li>
                    </ul>
                </div>
            </div>
        </div>
    </div>

    <p class="mt-4 d-flex flex-wrap gap-3">
        <a th:href="@{/applications}" th:text="#{common.backToApplications}">← 応募一覧へ</a>
        <a th:href="@{/applications/{id}/ai-questions(id=${jobApplication.id})}" th:text="#{ai.questions.goto}">想定質問を作る →</a>
    </p>
</main>
</body>
</html>
