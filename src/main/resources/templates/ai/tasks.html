<!DOCTYPE html>
<html lang="ja" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="#{ai.tasks.title} + ' | JobTrack'">AIで締切を抽出 | JobTrack</title>
    <th:block th:replace="~{fragments/header :: assets}"></th:block>
</head>
<body>
<header th:replace="~{fragments/header :: navbar}"></header>
<main class="container pb-5" style="max-width: 900px;">
    <div class="jt-page-head">
        <div>
            <p class="jt-eyebrow">
                <span th:text="${jobApplication.company.name}">企業名</span>（<span th:text="${jobApplication.position}">職種</span>）
            </p>
            <h1 th:text="#{ai.tasks.title}">AIで締切を抽出</h1>
        </div>
    </div>

    <!-- 求人票 -->
    <div class="card mb-4">
        <div class="card-header" th:text="#{field.jdText}">求人票</div>
        <div class="card-body">
            <p class="mb-0" style="white-space: pre-wrap; max-height: 250px; overflow-y: auto;"
               th:if="${jobApplication.jdText != null and !jobApplication.jdText.isBlank()}"
               th:text="${jobApplication.jdText}">求人票の本文</p>
            <p class="text-muted mb-0" th:if="${jobApplication.jdText == null or jobApplication.jdText.isBlank()}">
                <span th:text="#{ai.noJd}">求人票が登録されていません。</span>
                <a th:href="@{/applications/{id}/edit(id=${jobApplication.id})}" th:text="#{ai.noJdLink}">応募の編集画面で貼り付けてください。</a>
            </p>
        </div>
    </div>

    <!-- AIで抽出ボタン（候補をまだ表示していないとき） -->
    <form th:if="${aiTaskForm == null and jobApplication.jdText != null and !jobApplication.jdText.isBlank()}"
          th:action="@{/applications/{id}/ai-tasks/extract(id=${jobApplication.id})}" method="post" class="mb-3">
        <button type="submit" class="btn btn-primary" th:text="#{ai.tasks.run}">AIで締切を抽出する</button>
        <div class="form-text" th:text="#{ai.privacy.jd}">求人票の本文だけをAIに送信します。個人情報は送信しません。</div>
    </form>

    <div class="alert alert-danger" th:if="${aiError != null}" th:text="${aiError}">エラー</div>

    <!-- 候補の確認 -->
    <div th:if="${aiTaskForm != null}">
        <h2 class="h5" th:text="#{ai.tasks.result}">AIの提案</h2>
        <p class="text-muted" th:if="${aiTaskForm.items.isEmpty()}" th:text="#{ai.tasks.none}">求人票から締切は見つかりませんでした。</p>

        <form th:unless="${aiTaskForm.items.isEmpty()}"
              th:action="@{/applications/{id}/ai-tasks(id=${jobApplication.id})}"
              th:object="${aiTaskForm}" method="post">
            <p class="small text-muted" th:text="#{ai.tasks.check}">AIは間違えることがあります。内容を確認・修正し、登録するものにチェックしてください。</p>
            <div class="table-wrap mb-3">
                <table class="table align-middle">
                    <thead>
                    <tr>
                        <th style="width: 80px;" th:text="#{ai.tasks.register}">登録</th>
                        <th th:text="#{field.task}">タスク</th>
                        <th style="width: 200px;" th:text="#{field.dueDate}">締切</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="item, stat : *{items}">
                        <td class="text-center">
                            <input type="checkbox" class="form-check-input"
                                   th:field="*{items[__${stat.index}__].selected}" th:attr="aria-label=#{ai.tasks.register}">
                        </td>
                        <td>
                            <input type="text" class="form-control" th:field="*{items[__${stat.index}__].title}">
                            <div class="text-danger small" th:errors="*{items[__${stat.index}__].title}"></div>
                        </td>
                        <td>
                            <input type="date" class="form-control" th:field="*{items[__${stat.index}__].dueDate}">
                            <div class="text-danger small" th:errors="*{items[__${stat.index}__].dueDate}"></div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
            <button type="submit" class="btn btn-success" th:text="#{ai.tasks.save}">チェックしたタスクを登録</button>
        </form>
    </div>

    <p class="mt-4"><a th:href="@{/applications}" th:text="#{common.backToApplications}">← 応募一覧へ</a></p>
</main>
</body>
</html>
