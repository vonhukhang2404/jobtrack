<!DOCTYPE html>
<html lang="ja" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="#{ai.questions.title} + ' | JobTrack'">面接の想定質問 | JobTrack</title>
    <th:block th:replace="~{fragments/header :: assets}"></th:block>
</head>
<body>
<header th:replace="~{fragments/header :: navbar}"></header>
<main class="container pb-5" style="max-width: 900px;">
    <div class="jt-page-head">
        <div>
            <p class="jt-eyebrow">
                <span th:text="${jobApplication.company.name}">企業名</span>（<span th:text="${jobApplication.position}">職種</span>）
            </p>
            <h1 th:text="#{ai.questions.title}">面接の想定質問</h1>
        </div>
    </div>

    <!-- これまでの面接 -->
    <div class="card mb-4">
        <div class="card-header" th:text="#{ai.questions.past}">これまでの面接</div>
        <p class="text-muted p-3 mb-0" th:if="${interviews.isEmpty()}" th:text="#{ai.questions.noPast}">
            まだ面接が登録されていません。求人票だけをもとに質問を作ります。
        </p>
        <ul class="list-group list-group-flush" th:unless="${interviews.isEmpty()}">
            <li class="list-group-item" th:each="i : ${interviews}">
                <strong th:text="#{interview.round(${i.round})}">第1次</strong>
                <span class="text-muted small ms-2"
                      th:text="${#temporals.format(i.scheduledAt, #messages.msg('fmt.date'))} + '・' + ${#messages.msg('format.' + i.format.name())} + '・' + ${#messages.msg('result.' + i.result.name())}">日付</span>
                <div class="small mt-1" style="white-space: pre-wrap;"
                     th:text="${i.notes != null and !i.notes.isBlank()} ? ${i.notes} : #{ai.questions.noMemo}">メモ</div>
            </li>
        </ul>
    </div>

    <form th:action="@{/applications/{id}/ai-questions(id=${jobApplication.id})}" method="post" class="mb-3">
        <button type="submit" class="btn btn-primary" th:text="#{ai.questions.run}">想定質問を作る</button>
        <div class="form-text" th:text="#{ai.privacy.memo}">求人票と面接メモをAIに送信します。メモに個人情報を書かないでください。</div>
    </form>

    <div class="alert alert-danger" th:if="${aiError != null}" th:text="${aiError}">エラー</div>

    <!-- 想定質問 -->
    <div th:if="${questions != null}">
        <p class="small text-muted" th:text="#{ai.questions.disclaimer}">AIが作った質問です。自分の言葉で答えを準備しましょう。</p>
        <div class="card mb-3" th:each="q, stat : ${questions}">
            <div class="card-header">
                <span th:text="'Q' + ${stat.count} + '. '">Q1. </span><span th:text="${q.question()}">質問</span>
            </div>
            <div class="card-body">
                <p class="mb-2" th:if="${!q.intent().isEmpty()}">
                    <span class="badge bg-secondary me-1" th:text="#{ai.questions.intent}">意図</span><span th:text="${q.intent()}">確認したいこと</span>
                </p>
                <p class="mb-0" th:if="${!q.hint().isEmpty()}">
                    <span class="badge bg-success me-1" th:text="#{ai.questions.hintLabel}">ヒント</span><span th:text="${q.hint()}">答え方</span>
                </p>

                <!-- 自分の回答をAIに添削してもらう -->
                <details class="mt-3">
                    <summary class="small text-primary" th:text="#{ai.questions.writeAnswer}">自分の回答を書いて添削してもらう</summary>
                    <form th:action="@{/applications/{id}/ai-questions/review(id=${jobApplication.id})}"
                          method="post" class="mt-2">
                        <input type="hidden" name="question" th:value="${q.question()}">
                        <input type="hidden" name="intent" th:value="${q.intent()}">
                        <textarea name="answer" rows="5" class="form-control" maxlength="1000"
                                  th:placeholder="#{ai.questions.answerPlaceholder}" th:attr="aria-label=#{ai.review.yourAnswer}"></textarea>
                        <button type="submit" class="btn btn-sm btn-success mt-2" th:text="#{ai.review.run}">添削する</button>
                    </form>
                </details>
            </div>
        </div>

        <!-- 別の質問を作る：これまでの質問を送って、違う質問を作らせる -->
        <form th:action="@{/applications/{id}/ai-questions(id=${jobApplication.id})}" method="post" class="mb-3">
            <input type="hidden" name="excluded" th:each="ex : ${nextExcluded}" th:value="${ex}">
            <button type="submit" class="btn btn-outline-primary" th:text="#{ai.questions.more}">別の質問を作る</button>
            <span class="form-text ms-2" th:text="#{ai.questions.moreHint}">今の質問とは違う質問を作ります。</span>
        </form>
    </div>

    <p class="mt-4 d-flex flex-wrap gap-3">
        <a th:href="@{/applications}" th:text="#{common.backToApplications}">← 応募一覧へ</a>
        <a th:href="@{/applications/{id}/ai-summary(id=${jobApplication.id})}" th:text="#{ai.summary.goto}">求人票の解説 →</a>
    </p>
</main>
</body>
</html>
