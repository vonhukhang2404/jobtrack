<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>面接の想定質問 | JobTrack</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav th:replace="~{fragments/header :: navbar}"></nav>
<div class="container" style="max-width: 900px;">
    <h1 class="h3 mb-1">💬 面接の想定質問</h1>
    <p class="text-muted mb-4">
        <span th:text="${jobApplication.company.name}">企業名</span>（<span th:text="${jobApplication.position}">職種</span>）
    </p>

    <!-- これまでの面接 -->
    <div class="card mb-4">
        <div class="card-header">これまでの面接</div>
        <p class="text-muted p-3 mb-0" th:if="${interviews.isEmpty()}">
            まだ面接が登録されていません。求人票だけをもとに質問を作ります。
        </p>
        <ul class="list-group list-group-flush" th:unless="${interviews.isEmpty()}">
            <li class="list-group-item" th:each="i : ${interviews}">
                <strong th:text="'第' + ${i.round} + '次'">第1次</strong>
                <span class="text-muted small ms-2"
                      th:text="${#temporals.format(i.scheduledAt, 'yyyy/MM/dd')} + '・' + ${i.format.label} + '・' + ${i.result.label}">日付</span>
                <div class="small mt-1" style="white-space: pre-wrap;"
                     th:text="${i.notes != null and !i.notes.isBlank()} ? ${i.notes} : 'メモなし'">メモ</div>
            </li>
        </ul>
    </div>

    <form th:action="@{/applications/{id}/ai-questions(id=${jobApplication.id})}" method="post" class="mb-3">
        <button type="submit" class="btn btn-primary">🤖 想定質問を作る</button>
        <div class="form-text">求人票と面接メモをAIに送信します。メモに個人情報を書かないでください。</div>
    </form>

    <!-- エラー -->
    <div class="alert alert-danger" th:if="${aiError != null}" th:text="${aiError}">エラー</div>

    <!-- 想定質問 -->
    <div th:if="${questions != null}">
        <p class="small text-muted">AIが作った質問です。自分の言葉で答えを準備しましょう。</p>
        <div class="card mb-3" th:each="q, stat : ${questions}">
            <div class="card-header">
                <strong th:text="'Q' + ${stat.count} + '. '">Q1. </strong><span th:text="${q.question()}">質問</span>
            </div>
            <div class="card-body">
                <p class="mb-2" th:if="${!q.intent().isEmpty()}">
                    <span class="badge bg-secondary me-1">意図</span><span th:text="${q.intent()}">確認したいこと</span>
                </p>
                <p class="mb-0" th:if="${!q.hint().isEmpty()}">
                    <span class="badge bg-success me-1">ヒント</span><span th:text="${q.hint()}">答え方</span>
                </p>

                <!-- 自分の回答をAIに添削してもらう -->
                <details class="mt-3">
                    <summary class="small text-primary">✍ 自分の回答を書いて添削してもらう</summary>
                    <form th:action="@{/applications/{id}/ai-questions/review(id=${jobApplication.id})}"
                          method="post" class="mt-2">
                        <input type="hidden" name="question" th:value="${q.question()}">
                        <input type="hidden" name="intent" th:value="${q.intent()}">
                        <textarea name="answer" rows="5" class="form-control" maxlength="1000"
                                  placeholder="面接で話すつもりの回答を書いてください（1000文字まで）"></textarea>
                        <button type="submit" class="btn btn-sm btn-success mt-2">🤖 添削する</button>
                    </form>
                </details>
            </div>
        </div>

        <!-- 別の質問を作る：これまでの質問を送って、違う質問を作らせる -->
        <form th:action="@{/applications/{id}/ai-questions(id=${jobApplication.id})}" method="post" class="mb-3">
            <input type="hidden" name="excluded" th:each="ex : ${nextExcluded}" th:value="${ex}">
            <button type="submit" class="btn btn-outline-primary">🔄 別の質問を作る</button>
            <span class="form-text ms-2">今の質問とは違う質問を作ります。</span>
        </form>
    </div>

    <p class="mt-4">
        <a th:href="@{/applications}">← 応募一覧へ</a>
        <a class="ms-3" th:href="@{/applications/{id}/ai-summary(id=${jobApplication.id})}">📖 求人票の解説 →</a>
    </p>
</div>
</body>
</html>
