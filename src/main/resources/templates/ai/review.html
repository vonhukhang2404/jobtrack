<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>回答の添削 | JobTrack</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav th:replace="~{fragments/header :: navbar}"></nav>
<div class="container" style="max-width: 900px;">
    <h1 class="h3 mb-1">✍ 回答の添削</h1>
    <p class="text-muted mb-4">
        <span th:text="${jobApplication.company.name}">企業名</span>（<span th:text="${jobApplication.position}">職種</span>）
    </p>

    <!-- 質問 -->
    <div class="card mb-3">
        <div class="card-header"><strong>Q. </strong><span th:text="${question}">質問</span></div>
        <div class="card-body" th:if="${intent != null and !intent.isBlank()}">
            <span class="badge bg-secondary me-1">意図</span><span th:text="${intent}">確認したいこと</span>
        </div>
    </div>

    <!-- 自分の回答（直して、もう一度添削できる） -->
    <form th:action="@{/applications/{id}/ai-questions/review(id=${jobApplication.id})}" method="post" class="mb-4">
        <input type="hidden" name="question" th:value="${question}">
        <input type="hidden" name="intent" th:value="${intent}">
        <label class="form-label">自分の回答</label>
        <textarea name="answer" rows="6" class="form-control" th:maxlength="${maxAnswerLength}"
                  th:text="${answer}"></textarea>
        <button type="submit" class="btn btn-success mt-2">🤖 もう一度添削する</button>
        <div class="form-text">回答をAIに送信します。名前や連絡先などの個人情報は書かないでください。</div>
    </form>

    <!-- エラー -->
    <div class="alert alert-danger" th:if="${aiError != null}" th:text="${aiError}">エラー</div>

    <!-- 添削結果 -->
    <div th:if="${review != null}">
        <p class="small text-muted">
            AIによる添削です。【 】の部分は、自分の経験を書き足してください。最後は自分の言葉で話せるようにしましょう。
        </p>

        <div class="row">
            <div class="col-md-6 mb-3" th:if="${!review.goodPoints().isEmpty()}">
                <div class="card h-100 border-success">
                    <div class="card-header">👍 良い点</div>
                    <ul class="list-group list-group-flush">
                        <li class="list-group-item" th:each="item : ${review.goodPoints()}" th:text="${item}">良い点</li>
                    </ul>
                </div>
            </div>
            <div class="col-md-6 mb-3" th:if="${!review.improvements().isEmpty()}">
                <div class="card h-100 border-warning">
                    <div class="card-header">🔧 改善点</div>
                    <ul class="list-group list-group-flush">
                        <li class="list-group-item" th:each="item : ${review.improvements()}" th:text="${item}">改善点</li>
                    </ul>
                </div>
            </div>
        </div>

        <div class="card mb-3" th:if="${!review.revised().isEmpty()}">
            <div class="card-header">📝 修正例</div>
            <div class="card-body">
                <p class="mb-0" style="white-space: pre-wrap;" th:text="${review.revised()}">修正例</p>
            </div>
        </div>
    </div>

    <p class="mt-4">
        <a th:href="@{/applications/{id}/ai-questions(id=${jobApplication.id})}">← 想定質問へ</a>
    </p>
</div>
</body>
</html>
