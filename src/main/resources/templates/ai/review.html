<!DOCTYPE html>
<html lang="ja" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="#{ai.review.title} + ' | JobTrack'">回答の添削 | JobTrack</title>
    <th:block th:replace="~{fragments/header :: assets}"></th:block>
</head>
<body>
<header th:replace="~{fragments/header :: navbar}"></header>
<main class="container pb-5" style="max-width: 900px;">
    <div class="jt-page-head">
        <div>
            <p class="jt-eyebrow">
                <span th:text="${jobApplication.company.name}">企業名</span>（<span th:text="${jobApplication.position}">職種</span>）
            </p>
            <h1 th:text="#{ai.review.title}">回答の添削</h1>
        </div>
    </div>

    <!-- 質問 -->
    <div class="card mb-3">
        <div class="card-header"><span>Q. </span><span th:text="${question}">質問</span></div>
        <div class="card-body" th:if="${intent != null and !intent.isBlank()}">
            <span class="badge bg-secondary me-1" th:text="#{ai.questions.intent}">意図</span><span th:text="${intent}">確認したいこと</span>
        </div>
    </div>

    <!-- 自分の回答（直して、もう一度添削できる） -->
    <form th:action="@{/applications/{id}/ai-questions/review(id=${jobApplication.id})}" method="post" class="mb-4">
        <input type="hidden" name="question" th:value="${question}">
        <input type="hidden" name="intent" th:value="${intent}">
        <label class="form-label" for="answer" th:text="#{ai.review.yourAnswer}">自分の回答</label>
        <textarea id="answer" name="answer" rows="6" class="form-control" th:maxlength="${maxAnswerLength}"
                  th:text="${answer}"></textarea>
        <button type="submit" class="btn btn-success mt-2" th:text="#{ai.review.again}">もう一度添削する</button>
        <div class="form-text" th:text="#{ai.privacy.answer}">回答をAIに送信します。名前や連絡先などの個人情報は書かないでください。</div>
    </form>

    <div class="alert alert-danger" th:if="${aiError != null}" th:text="${aiError}">エラー</div>

    <!-- 添削結果 -->
    <div th:if="${review != null}">
        <p class="small text-muted" th:text="#{ai.review.disclaimer}">
            AIによる添削です。【 】の部分は、自分の経験を書き足してください。最後は自分の言葉で話せるようにしましょう。
        </p>
        <div class="row">
            <div class="col-md-6 mb-3" th:if="${!review.goodPoints().isEmpty()}">
                <div class="card h-100 border-success">
                    <div class="card-header" th:text="#{ai.review.good}">良い点</div>
                    <ul class="list-group list-group-flush">
                        <li class="list-group-item" th:each="item : ${review.goodPoints()}" th:text="${item}">良い点</li>
                    </ul>
                </div>
            </div>
            <div class="col-md-6 mb-3" th:if="${!review.improvements().isEmpty()}">
                <div class="card h-100 border-warning">
                    <div class="card-header" th:text="#{ai.review.improve}">改善点</div>
                    <ul class="list-group list-group-flush">
                        <li class="list-group-item" th:each="item : ${review.improvements()}" th:text="${item}">改善点</li>
                    </ul>
                </div>
            </div>
        </div>
        <div class="card mb-3" th:if="${!review.revised().isEmpty()}">
            <div class="card-header" th:text="#{ai.review.revised}">修正例</div>
            <div class="card-body">
                <p class="mb-0" style="white-space: pre-wrap;" th:text="${review.revised()}">修正例</p>
            </div>
        </div>
    </div>

    <p class="mt-4"><a th:href="@{/applications/{id}/ai-questions(id=${jobApplication.id})}" th:text="#{ai.review.back}">← 想定質問へ</a></p>
</main>
</body>
</html>
