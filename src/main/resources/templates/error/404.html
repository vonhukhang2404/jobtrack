<!DOCTYPE html>
<html lang="ja" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="#{error.404.title} + ' | JobTrack'">ページが見つかりません | JobTrack</title>
    <th:block th:replace="~{fragments/header :: assets}"></th:block>
</head>
<body>
<header th:replace="~{fragments/header :: navbar}"></header>
<main class="container text-center py-5" style="max-width: 600px;">
    <p class="jt-head display-4 jt-ai-text">404</p>
    <h1 class="h4" th:text="#{error.404.title}">ページが見つかりません。</h1>
    <p class="text-muted" th:text="#{error.404.text}">URLが間違っているか、アクセスできないデータです。</p>
    <a th:href="@{/}" class="btn btn-primary" th:text="#{error.home}">トップへ戻る</a>
</main>
</body>
</html>
