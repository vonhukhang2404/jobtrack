<!DOCTYPE html>
<html lang="ja" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="#{login.title} + ' | JobTrack'">ログイン | JobTrack</title>
    <th:block th:replace="~{fragments/header :: assets}"></th:block>
</head>
<body>
<div class="jt-auth-tools">
    <div th:replace="~{fragments/header :: langTheme}"></div>
</div>
<main class="jt-auth">
    <span class="jt-brand jt-head">JobTrack<span>.</span></span>

    <!-- Sai email/mật khẩu: Spring chuyển về /login?error -->
    <div th:if="${param.error}" class="alert alert-danger" th:text="#{login.error}">
        メールアドレスまたはパスワードが正しくありません。
    </div>
    <!-- Đăng xuất xong: /login?logout -->
    <div th:if="${param.logout}" class="alert alert-success" th:text="#{login.loggedOut}">
        ログアウトしました。
    </div>
    <div th:if="${param.registered}" class="alert alert-success" th:text="#{login.registered}">
        登録が完了しました。ログインしてください。
    </div>

    <div class="jt-box p-4">
        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <label class="form-label" for="email" th:text="#{field.email}">メールアドレス</label>
                <input type="email" id="email" name="email" class="form-control" required autocomplete="username">
            </div>
            <div class="mb-3">
                <label class="form-label" for="password" th:text="#{field.password}">パスワード</label>
                <input type="password" id="password" name="password" class="form-control" required autocomplete="current-password">
            </div>
            <button type="submit" class="btn btn-primary w-100 py-2" th:text="#{login.submit}">ログイン</button>
        </form>
    </div>

    <p class="mt-3 text-center"><a th:href="@{/register}" th:text="#{login.toRegister}">新規登録はこちら</a></p>
</main>
</body>
</html>
