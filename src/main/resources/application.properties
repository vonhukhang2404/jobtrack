spring.application.name=jobtrack

# ===== Database (PostgreSQL / Supabase) =====
# Giá trị lấy từ biến môi trường, KHÔNG ghi trực tiếp vào đây
#   DB_URL      ví dụ: jdbc:postgresql://aws-0-ap-northeast-1.pooler.supabase.com:5432/postgres?sslmode=require
#   DB_USERNAME ví dụ: jobtrack_app.<project-ref>
#   DB_PASSWORD
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
# Supabase gói miễn phí giới hạn số kết nối → giữ pool nhỏ
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:3}

# ===== JPA =====
# Bảng được tạo bằng schema.sql → JPA chỉ kiểm tra Entity có khớp với bảng hay không
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

# ===== AI =====
# Key lấy từ biến môi trường, KHÔNG ghi trực tiếp vào đây
# ai.provider: groq（mặc định）/ gemini
ai.provider=${AI_PROVIDER:groq}
groq.api-key=${GROQ_API_KEY:}
groq.model=${GROQ_MODEL:openai/gpt-oss-120b}
gemini.api-key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-2.5-flash}

# ===== Upload (資料の取り込み) =====
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# ===== Session (lưu trong DB: bảng spring_session, tạo bằng database/postgres/01_schema.sql) =====
spring.session.jdbc.initialize-schema=never
server.servlet.session.timeout=8h

# ===== Server =====
# Vercel chỉ định cổng bằng biến môi trường PORT
server.port=${PORT:8080}
# Chạy sau proxy của Vercel (HTTPS) → dùng header X-Forwarded-*
server.forward-headers-strategy=framework
