spring.application.name=jobtrack

# ===== Database =====
spring.datasource.url=jdbc:mysql://localhost:3306/jobtrack?serverTimezone=Asia/Tokyo&characterEncoding=UTF-8
spring.datasource.username=${DB_USERNAME:jobtrack_app}
spring.datasource.password=${DB_PASSWORD}

# ===== JPA =====
# Bảng được tạo bằng schema.sql → JPA chỉ kiểm tra Entity có khớp với bảng hay không
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
